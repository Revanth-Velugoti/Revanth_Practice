name: Artifact Demo

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Create File
        run: echo "Hello Revanth" > message.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: message.txt

  read:
    runs-on: ubuntu-latest
    needs: create

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifact

      - name: Display File
        run: cat message.txt
